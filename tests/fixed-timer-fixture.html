<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fixed Long Timer Regression</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="question-active">
    <main id="app">
      <div class="question-toolbar fixed-question-timer">
        <span>LONG · 選択問題 · Question 2 / 5</span>
        <div class="question-timer"><span>残り</span><strong>00:43</strong></div>
      </div>
      <section class="focus-question">
        <form>
          <div class="question-scroll"><fieldset class="question-card single-question">
            <legend>Which explanation best accounts for the council's decision to retain the revised transport schedule despite the unexpected operational drawback described in the passage?</legend>
            <div class="choice-list">
              <label><input type="radio" name="answer"><span class="choice-marker">A</span><span>The council concluded that the temporary increase in transfer time was acceptable because the revised schedule substantially reduced winter cancellations in the outer districts.</span></label>
              <label><input type="radio" name="answer"><span class="choice-marker">B</span><span>The council believed that passengers would eventually stop noticing delays once the new ticketing system had been introduced across every station in the network.</span></label>
              <label><input type="radio" name="answer"><span class="choice-marker">C</span><span>The council retained the schedule because fuel prices had fallen, allowing the operator to expand weekend service without changing its original annual transport budget.</span></label>
              <label><input type="radio" name="answer"><span class="choice-marker">D</span><span>The council expected neighboring cities to adopt the same timetable, creating a regional standard that would remove the need for further passenger consultation.</span></label>
            </div>
          </fieldset><div style="height:520px" aria-hidden="true"></div></div>
          <div class="question-action"><button class="primary-button dark" type="button">次へ <span>→</span></button></div>
        </form>
      </section>
    </main>
  </body>
</html>
